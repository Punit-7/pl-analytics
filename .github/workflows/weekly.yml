name: Weekly model run

on:
  schedule:
    - cron: "17 6 * * 4"   # every Thursday at 06:17 UTC
  workflow_dispatch:        # also allows a manual run from the Actions tab

permissions:
  contents: write           # the job commits the new model and predictions

concurrency:
  group: weekly-model-run
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: sqlite:///serving/state/mlflow.db

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: serving/requirements-job.txt
      - name: Install packages
        run: pip install -r serving/requirements-job.txt

      - name: Retrain, gate, publish, score
        run: python -m serving.weekly

      - name: Test the new model files and the API
        run: pytest -q tests/test_serving_artifacts.py tests/test_serving_api.py

      - name: Build the image and call it
        run: |
          docker build -f serving/Dockerfile -t pl-api .
          docker run -d --name api -p 10000:10000 pl-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:10000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:10000/health

      - name: Commit the model and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serving/models serving/predictions serving/state serving/reports/run.json
          git diff --cached --quiet || git commit -m "Weekly model run $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Monitoring - drift, MLflow, status page
        run: python -m serving.monitor.report

      - name: Commit the monitoring files
        run: |
          git add serving/reports/STATUS.md serving/reports/drift.json serving/state/mlflow.db
          git diff --cached --quiet || git commit -m "Weekly monitoring $(date -u +%F) [skip render]"
          git pull --rebase --autostash
          git push

      - name: Keep the Evidently report
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: serving/reports/drift_report.html
          if-no-files-found: ignore