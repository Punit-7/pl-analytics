name: FPL suggestion

on:
  schedule:
    - cron: "47 5 * * *"   # every day at 05:47 UTC (11:17 in India)
  workflow_dispatch:        # also allows a manual run from the Actions tab

permissions:
  contents: write           # the job commits the new picture and plan

concurrency:
  group: fpl-suggestion
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modelling/requirements-fpl.txt
      - name: Install packages
        run: pip install -r modelling/requirements-fpl.txt

      - name: Download FPL data
        run: python -m data.ingest.fpl

      - name: Plan the team
        run: python -m modelling.match.fpl_squad --from-csv

      - name: Draw the pitch
        run: python -m modelling.match.fpl_pitch

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modelling/reports/fpl_pitch.svg modelling/reports/fpl_pitch.html \
            modelling/reports/fpl_plan.json modelling/reports/fpl_squad.csv
          git diff --cached --quiet || git commit -m "FPL suggestion $(date -u +%F) [skip render]"
          git pull --rebase --autostash
          git push
