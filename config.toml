[seasons]
first = 1993               # first season in football-data.co.uk
understat_first = 2014     # first season with Understat xG
season_start_month = 8     # from August, the new season is "current"

[paths]
raw = "data/raw"
reference = "data/reference"
marts = "data/marts"
logs = "logs"

[database]
staging_schema = "staging" # new tables are built here first
mart_schema = "mart"       # tested tables the dashboards read
ops_schema = "ops"         # pipeline run log
reader_role = "pl_reader"  # read-only role for Power BI and Excel

[http]
timeout_seconds = 30
max_retries = 3
backoff_factor = 2
delay_seconds = 1
user_agent = "pl-analytics portfolio project"

[sources]
understat_enabled = true

[modelling]
random_seed = 2026
# xG model: StatsBomb Open Data 2015/16 Big 5 leagues, as [competition_id, season_id]
xg_competitions = [[2, 27], [11, 27], [9, 27], [12, 27], [7, 27]]
xg_test_size = 0.2
# Dixon-Coles match model
dc_xi = 0.0019               # time-decay rate per day (half-life about one year)
dc_history_days = 1095       # each fit uses the last three years of matches
dc_max_goals = 10            # score matrix covers 0-10 goals per team
backtest_first_season = 2019 # closing odds exist from 2019/20
# Season simulation and predictions
n_sims = 10000
prediction_window_days = 7
model_version = "dc-1.0"

[modelling.fpl]              # FPL add-on (appendix)
team_id = 9085825                  # your FPL team ID; 0 = no team, so only a fresh 15 is picked
horizon = 5                  # gameweeks the squad is chosen for
hit_cost = 4                 # points FPL deducts for each transfer beyond the free ones
max_hits = 2                 # never suggest more than this many paid transfers
min_gain_per_transfer = 1.0  # a transfer must gain at least this over the horizon to be used
wildcard_min_gain = 15.0     # suggest the Wildcard if a fresh 15 gains this over the horizon
freehit_min_gain = 10.0      # suggest the Free Hit if it gains this in the next gameweek
bench_boost_min = 15.0       # suggest Bench Boost if the bench projects this many points
triple_captain_min = 10.0    # suggest Triple Captain if the captain projects this many points

[nlp]
labels = ["PLAYER", "TEAM", "VENUE"]
# Wikimedia requires a descriptive User-Agent: name/version (contact).
wiki_user_agent = "pl-analytics-portfolio/0.1 (https://github.com/Punit-7/pl-analytics)"
wiki_delay_seconds = 1.0    # one request per second, one at a time
first_season = 2015         # club season articles from 2015/16
min_paragraph_chars = 200   # shorter paragraphs are mostly captions or lists
label_target = 400          # paragraphs to label
test_share = 0.2
dev_share = 0.1
base_model = "distilroberta-base"
max_length = 384            # subword tokens per paragraph
epochs = 4
learning_rate = 5e-5
batch_size = 8
link_threshold = 85         # fuzzy-match score (0-100) needed to accept a link
random_seed = 2026
model_version = "ner-1.0"

[assistant]
provider = "ollama"                 # "ollama" (local, free) or "openai_compatible" (hosted, paid)
ollama_url = "http://localhost:11434"
chat_model = "llama3.2:3b"          # 2.0 GB download; fits a PC with 8 GB of RAM
embed_model = "all-minilm"          # 46 MB embedding model
num_ctx = 4096                      # context window in tokens
temperature = 0.0                   # 0 = always pick the most likely token
seed = 2026
keep_alive = "30m"                  # keep the model in memory between questions
request_timeout_seconds = 600
# think = false                     # uncomment only for thinking models such as qwen3
# Hosted model, used only in Stage 12. The key goes in .env as LLM_API_KEY, never here.
hosted_base_url = "https://api.openai.com/v1"
hosted_model = ""
hosted_price_in = 0.0               # US dollars per 1 million input tokens
hosted_price_out = 0.0              # US dollars per 1 million output tokens
# Text-to-SQL
sql_tables = ["mart.fact_team_match", "mart.fact_match", "mart.fixture"]
sql_timeout_ms = 5000               # the database cancels a slower query
sql_max_rows = 200                  # rows returned to the assistant at most
few_shot = 6                        # dev examples shown to the model
# Article search
top_k = 5                           # paragraphs given to the model
source_chars = 700                  # characters of each paragraph given to the model
rrf_k = 60
bm25_k1 = 1.5
bm25_b = 0.75
embed_batch = 16
# Agent
max_steps = 3                       # model calls allowed per question
assistant_version = "assistant-1.0"
